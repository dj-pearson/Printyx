# Server CI/CD Pipeline
#
# Runs on pushes/PRs to main branch.
# Steps: lint, typecheck, test, build Docker image, deploy.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'mobile/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'mobile/**'
      - '*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Quality Gate ────────────────────────────────────────
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: No committed data dumps (PA-011)
        run: npm run check:datadumps
      - name: No root-level SQL (PA-033)
        run: npm run check:rootsql
      - run: npm run lint
      - name: Route ownership ratchet (EDGE-018)
        run: npm run check:routes
      - name: Nav-target ratchet (AUDIT-014)
        run: npm run check:nav
      - name: Edge path-normalization ratchet (EDGE-002e)
        run: npm run check:edge-paths
      - run: npm run build
      - name: Server bundle check (PA-050)
        run: npx esbuild server/index.ts --platform=node --packages=external --bundle --format=esm --outfile=dist/server-bundle-check.mjs
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev || true
      - name: Supply chain security check
        run: npx tsx scripts/supply-chain-check.ts
      - name: Dependency integrity check
        run: npx tsx scripts/dependency-check.ts
      - name: Secret scanning
        run: npm run check:secrets

  # ─── TypeScript Error Ratchet (QUALITY-002) ──────────────
  # The repo has thousands of pre-existing tsc errors, so we can't gate on a
  # clean typecheck yet. This fails only when the error count GROWS above the
  # committed baseline (docs/typecheck-baseline.json) — debt can shrink, never
  # grow. Lower the baseline as errors are fixed: npm run check:types -- --update-baseline.
  typecheck-ratchet:
    name: TypeScript Error Ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Assert tsc error count did not grow
        run: npm run check:types

  # ─── Route Parity Report (non-blocking, EDGE-012) ────────
  route-parity:
    name: Route Parity Report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Regenerate route-parity matrix
        run: npm run audit:routes
      - name: Publish matrix to job summary
        run: cat docs/route-parity-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - name: Flag stale committed matrix (non-blocking)
        run: |
          if ! git diff --quiet -- docs/route-parity-matrix.md docs/route-divergence.json; then
            echo "::warning::Committed route-parity matrix is stale. Run 'npm run audit:routes' and commit docs/route-parity-matrix.md + docs/route-divergence.json."
          else
            echo "Route-parity matrix is up to date."
          fi
      - name: Upload matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: route-parity-matrix
          path: |
            docs/route-parity-matrix.md
            docs/route-divergence.json

  # ─── Unit & Integration Tests ────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: printyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/printyx_test
      # db.ts requires DATABASE_URL at module load; the unit tests mock queries
      # but still import middleware that pulls in db.ts. Point it at the same
      # CI Postgres service so those files load (tenant-isolation, rbac-*).
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/printyx_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Unit tests only. `npm run test` (bare `vitest run`) also pulls in
      # server/tests/integration, which need a migrated test DB the CI Postgres
      # service doesn't set up (relation "rbac_audit_log" does not exist).
      - run: npm run test:unit
      # Integration tests require schema/migrations against TEST_DATABASE_URL,
      # which this job doesn't apply yet — pre-existing gap, tracked separately.
      # Non-blocking until the test-DB schema setup is added.
      - run: npm run test:integration
        continue-on-error: true

  # ─── Sentry Source Map Upload ────────────────────────────
  sentry-release:
    name: Upload Source Maps to Sentry
    needs: [quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build with source maps
        run: npm run build -- --sourcemap
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ github.sha }}
      - name: Upload source maps to Sentry
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ github.sha }}
          sourcemaps: ./dist/assets
          url_prefix: ~/assets

  # ─── Docker Build & Push ─────────────────────────────────
  build-image:
    name: Build Docker Image
    needs: [quality, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─── Deploy to Staging ───────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: [build-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
      - name: Deploy to staging
        run: |
          kubectl set image deployment/printyx \
            printyx=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-image.outputs.image-digest }} \
            -n printyx-staging
          kubectl rollout status deployment/printyx -n printyx-staging --timeout=300s

  # ─── Deploy to Production ────────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
      - name: Deploy to production
        run: |
          kubectl set image deployment/printyx \
            printyx=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-image.outputs.image-digest }} \
            -n printyx
          kubectl rollout status deployment/printyx -n printyx --timeout=300s
