# GitHub Actions workflow to test Edge Functions before deployment
name: Test Edge Functions

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'Dockerfile.edge-functions'
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'Dockerfile.edge-functions'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.38.5

      - name: Check formatting
        run: |
          deno fmt --check supabase/functions/

      - name: Lint functions
        run: |
          deno lint supabase/functions/

      - name: Type check functions
        run: |
          for dir in supabase/functions/*/; do
            if [ -f "$dir/index.ts" ]; then
              echo "Type checking ${dir}index.ts"
              deno check "${dir}index.ts"
            fi
          done

      - name: Test Docker build
        run: |
          docker build -f Dockerfile.edge-functions -t edge-functions-test .

      - name: Run basic health check
        run: |
          docker run -d --name test-functions -p 8000:8000 \
            -e SUPABASE_URL=http://test \
            -e SUPABASE_ANON_KEY=test \
            -e SUPABASE_SERVICE_ROLE_KEY=test \
            edge-functions-test
          
          # Wait for container to start
          sleep 5
          
          # Test health endpoint
          curl -f http://localhost:8000/health || exit 1
          
          # Cleanup
          docker stop test-functions
          docker rm test-functions

  # Optional: Deploy notification
  notify:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: success() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Deployment ready
        run: |
          echo "✅ All tests passed! Ready for Coolify deployment."

