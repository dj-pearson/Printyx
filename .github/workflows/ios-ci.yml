# Native iOS CI (IOS-069)
#
# Runs the native SwiftUI app's unit tests on every PR that touches ios/**.
# The separate mobile-ci.yml covers the Expo app; ios-deploy.yml is the manual
# App Store pipeline. Before this workflow, PRs touching ios/ never compiled or
# ran xcodebuild test.
#
# Jobs:
#   build-test        Debug `xcodebuild test` on a simulator. This is the job to
#                     mark as a REQUIRED status check in branch protection for
#                     PRs touching ios/. Runs the full PrintyxTests target,
#                     including the IOS-031 decode/contract fixtures
#                     (PayloadContractTests) and the IOS-071 token-refresh tests.
#   release-pin-guard Release `xcodebuild test` of CertificatePinnerTests, which
#                     fails if any tracked host has an empty SPKI pin set
#                     (CertificatePinner.swift). It is continue-on-error for now
#                     because the pins are intentionally empty until IOS-014
#                     populates them — once they're populated, drop
#                     continue-on-error to make empty pins block a release.

name: iOS CI

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '26.2'
  SCHEME: Printyx

jobs:
  build-test:
    name: Build & Test (Debug)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          # No signing for CI test builds — clear the team placeholder.
          sed -i '' 's/DEVELOPMENT_TEAM: .*/DEVELOPMENT_TEAM: ""/' project.yml
          xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Printyx.xcodeproj \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath .spm

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "import sys, json; d = json.load(sys.stdin)['devices']; ids = [dev['udid'] for runtime, devs in d.items() if 'iOS' in runtime for dev in devs if dev.get('isAvailable') and dev['name'].startswith('iPhone')]; print(ids[0] if ids else '')")
          if [ -z "$UDID" ]; then echo "No available iPhone simulator found"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests (Debug)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Printyx.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm \
            -only-testing:PrintyxTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty

  release-pin-guard:
    name: Cert-pin guard (Release)
    runs-on: macos-15
    timeout-minutes: 30
    # Non-blocking until IOS-014 populates the SPKI pins. The pins are
    # intentionally empty today (fail-closed in Release), so this job is
    # expected to fail; remove continue-on-error once the pins are real so an
    # empty pin set blocks a release.
    continue-on-error: true
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          sed -i '' 's/DEVELOPMENT_TEAM: .*/DEVELOPMENT_TEAM: ""/' project.yml
          xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Printyx.xcodeproj \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath .spm

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "import sys, json; d = json.load(sys.stdin)['devices']; ids = [dev['udid'] for runtime, devs in d.items() if 'iOS' in runtime for dev in devs if dev.get('isAvailable') and dev['name'].startswith('iPhone')]; print(ids[0] if ids else '')")
          if [ -z "$UDID" ]; then echo "No available iPhone simulator found"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Enforce non-empty SPKI pins (Release)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Printyx.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm \
            -only-testing:PrintyxTests/CertificatePinnerTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | xcpretty
