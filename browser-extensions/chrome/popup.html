<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printyx Knowledge Capture</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9fafb;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
    }

    .container {
      padding: 20px;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #374151;
    }

    .button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 8px;
    }

    .button:hover {
      background: #5568d3;
    }

    .button.secondary {
      background: #e5e7eb;
      color: #374151;
    }

    .button.secondary:hover {
      background: #d1d5db;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 4px;
    }

    .input-group input,
    .input-group select,
    .input-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }

    .input-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .status {
      padding: 8px 12px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 6px;
      font-size: 13px;
      color: #065f46;
      margin-bottom: 12px;
    }

    .status.error {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    .settings-link {
      display: block;
      text-align: center;
      color: #667eea;
      font-size: 13px;
      text-decoration: none;
      margin-top: 12px;
    }

    .settings-link:hover {
      text-decoration: underline;
    }

    #captureForm {
      display: none;
    }

    #captureForm.active {
      display: block;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    .tab {
      flex: 1;
      padding: 8px 12px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 500;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 Printyx KB Capture</h1>
    <p>Save web content to your knowledge base</p>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab active" data-tab="capture">Capture</button>
      <button class="tab" data-tab="settings">Settings</button>
    </div>

    <!-- Capture Tab -->
    <div class="tab-content active" id="capture-tab">
      <div id="status"></div>

      <div class="section">
        <div class="section-title">Quick Capture</div>
        <button class="button" id="capturePageBtn">📄 Capture Current Page</button>
        <button class="button secondary" id="customCaptureBtn">✏️ Custom Capture</button>
      </div>

      <div id="captureForm">
        <div class="input-group">
          <label>Title</label>
          <input type="text" id="title" placeholder="Article title">
        </div>

        <div class="input-group">
          <label>Content</label>
          <textarea id="content" placeholder="Enter content or paste from clipboard"></textarea>
        </div>

        <div class="input-group">
          <label>Category</label>
          <select id="category">
            <option value="">Use default category</option>
          </select>
        </div>

        <div class="input-group">
          <label>Tags (comma-separated)</label>
          <input type="text" id="tags" placeholder="tag1, tag2, tag3">
        </div>

        <button class="button" id="saveBtn">💾 Save to KB</button>
        <button class="button secondary" id="cancelBtn">Cancel</button>
      </div>
    </div>

    <!-- Settings Tab -->
    <div class="tab-content" id="settings-tab">
      <div class="section">
        <div class="input-group">
          <label>API URL</label>
          <input type="text" id="apiUrl" placeholder="https://printyx.net/api">
        </div>

        <div class="input-group">
          <label>Auth Token</label>
          <input type="password" id="authToken" placeholder="Your authentication token">
        </div>

        <div class="input-group">
          <label>Tenant ID</label>
          <input type="text" id="tenantId" placeholder="Your tenant ID">
        </div>

        <div class="input-group">
          <label>User ID</label>
          <input type="text" id="userId" placeholder="Your user ID">
        </div>

        <div class="input-group">
          <label>Default Category ID</label>
          <input type="text" id="defaultCategoryId" placeholder="Default category for captures">
        </div>

        <button class="button" id="saveSettingsBtn">💾 Save Settings</button>
      </div>

      <div class="section">
        <div class="section-title">Instructions</div>
        <p style="font-size: 13px; color: #6b7280; line-height: 1.5;">
          1. Configure your API credentials above<br>
          2. Right-click on any page and select "Capture to Printyx KB"<br>
          3. Or use the quick capture button for the entire page
        </p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
