<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />

    <!-- Performance Optimization: DNS Prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- Performance Optimization: Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Primary Meta Tags -->
    <title>Printyx - AI-Powered Copier Dealer Management Platform | Modern Cloud ERP</title>
    <meta
      name="title"
      content="Printyx - AI-Powered Copier Dealer Management Platform | Modern Cloud ERP"
    />
    <meta
      name="description"
      content="Transform your copier dealership with Printyx's predictive intelligence platform. Modern cloud architecture with AI-powered forecasting, automated billing, and smart service dispatch. 2-3 year technical advantage over legacy systems like e-automate."
    />
    <meta
      name="keywords"
      content="copier dealer management software, AI predictive maintenance, cloud ERP for dealers, e-automate alternative, copier billing software, service dispatch automation, dealer profitability platform, intelligent CRM, predictive equipment failure, modern dealer management"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://printyx.net/" />
    <meta property="og:title" content="Printyx - AI-Powered Copier Dealer Management Platform" />
    <meta
      property="og:description"
      content="The only dealer management platform with predictive intelligence. Increase profitability 15-25% with AI-powered contract optimization, equipment failure prediction, and dynamic pricing."
    />
    <meta property="og:image" content="https://printyx.net/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://printyx.net/" />
    <meta
      property="twitter:title"
      content="Printyx - AI-Powered Copier Dealer Management Platform"
    />
    <meta
      property="twitter:description"
      content="Modern cloud platform for copier dealers with predictive AI, automated workflows, and intelligent pricing. Built on modern architecture with a 2-3 year technical advantage."
    />
    <meta property="twitter:image" content="https://printyx.net/twitter-image.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://printyx.net/" />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <meta name="author" content="Printyx" />

    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Printyx" />

    <!-- PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#2563eb" />

    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#3b82f6" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Printyx",
        "applicationCategory": "BusinessApplication",
        "offers": {
          "@type": "Offer",
          "price": "79",
          "priceCurrency": "USD",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "79",
            "priceCurrency": "USD",
            "unitText": "per user per month"
          }
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "ratingCount": "150",
          "bestRating": "5",
          "worstRating": "1"
        },
        "operatingSystem": "Web, iOS, Android",
        "description": "AI-powered copier dealer management platform with predictive intelligence, automated workflows, and modern cloud architecture. Replace legacy systems with intelligent, proactive operations.",
        "featureList": [
          "Predictive Equipment Failure Detection",
          "AI-Powered Contract Profitability Analysis",
          "Dynamic Pricing Optimization",
          "Automated Meter Billing",
          "Smart Service Dispatch with Route Optimization",
          "Integration Marketplace Ecosystem",
          "Real-time Revenue Intelligence Dashboard",
          "Natural Language Processing Interface",
          "Offline-First Mobile App"
        ]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Printyx",
        "url": "https://printyx.net",
        "logo": "https://printyx.net/logo.png",
        "description": "Modern cloud platform for copier dealer management with AI-powered predictive intelligence",
        "sameAs": ["https://www.linkedin.com/company/printyx", "https://twitter.com/printyx"],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "Sales",
          "email": "sales@printyx.com"
        }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- SEO: Initial content for crawlers before React hydrates -->
      <noscript>
        <div
          style="
            font-family:
              system-ui,
              -apple-system,
              sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
          "
        >
          <h1>Printyx - AI-Powered Copier Dealer Management Platform</h1>
          <p>
            Transform your copier dealership with modern cloud technology and predictive
            intelligence.
          </p>
          <h2>Key Features</h2>
          <ul>
            <li>
              <strong>Predictive Equipment Failure Detection</strong> - Know when devices need
              service before they fail
            </li>
            <li>
              <strong>AI-Powered Contract Profitability</strong> - Optimize every contract for
              maximum ROI
            </li>
            <li>
              <strong>Smart Service Dispatch</strong> - Route optimization and automated scheduling
            </li>
            <li>
              <strong>Automated Meter Billing</strong> - Accurate, timely billing with no manual
              entry
            </li>
            <li>
              <strong>Dynamic Pricing</strong> - Intelligent pricing recommendations based on market
              data
            </li>
            <li>
              <strong>Integration Marketplace</strong> - Connect with e-automate, Salesforce,
              QuickBooks, and more
            </li>
          </ul>
          <h2>Why Choose Printyx?</h2>
          <p>
            Printyx provides a 2-3 year technical advantage over legacy systems. Our modern cloud
            architecture delivers faster performance, better reliability, and AI capabilities that
            legacy systems simply cannot match.
          </p>
          <p>
            <strong>Ready to get started?</strong> Please enable JavaScript to access the full
            Printyx platform, or <a href="mailto:sales@printyx.com">contact our sales team</a> for a
            demo.
          </p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script
      type="text/javascript"
      src="https://replit.com/public/js/replit-dev-banner.js"

    ></script>
  </body>
</html>
