# Docker Compose for local Edge Functions development
version: '3.8'

services:
  edge-functions:
    build:
      context: .
      dockerfile: Dockerfile.edge-functions
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: printyx-edge-functions
    ports:
      - "8000:8000"
    environment:
      # Update these with your actual Supabase credentials
      - SUPABASE_URL=${SUPABASE_URL:-http://localhost:54321}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-your-anon-key}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-your-service-role-key}
    volumes:
      # Mount functions for hot-reload during development
      - ./supabase/functions:/app/functions:ro
    networks:
      - printyx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "deno", "eval", "fetch('http://localhost:8000/health').then(r => r.ok ? Deno.exit(0) : Deno.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  printyx-network:
    driver: bridge

# To run:
# docker-compose -f docker-compose.edge-functions.yml up -d

# To view logs:
# docker-compose -f docker-compose.edge-functions.yml logs -f

# To stop:
# docker-compose -f docker-compose.edge-functions.yml down

