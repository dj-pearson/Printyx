name: Printyx
options:
  bundleIdPrefix: net.printyx
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"

packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: "2.0.0"
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    from: "4.4.0"

targets:
  Printyx:
    type: application
    platform: iOS
    sources:
      - path: Printyx
    resources:
      - path: Printyx/Resources
    settings:
      base:
        INFOPLIST_FILE: Printyx/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: net.printyx.mainapp
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Lottie
    entitlements:
      path: Printyx/Printyx.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)net.printyx.mainapp

  PrintyxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrintyxTests
    dependencies:
      - target: Printyx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.printyx.mainapp.tests
        GENERATE_INFOPLIST_FILE: "YES"

  PrintyxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PrintyxUITests
    dependencies:
      - target: Printyx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.printyx.mainapp.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Printyx:
    build:
      targets:
        Printyx: all
        PrintyxTests: [test]
        PrintyxUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrintyxTests
        - PrintyxUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
