apiVersion: v1
kind: ConfigMap
metadata:
  name: printyx-config
  namespace: printyx
  labels:
    app.kubernetes.io/name: printyx
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  PORT: "5000"
  LOG_LEVEL: "info"
  # Database connection pool settings
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"
  # Session settings
  SESSION_MAX_AGE: "86400000"  # 24 hours in ms
  # Rate limiting
  RATE_LIMIT_WINDOW_MS: "900000"  # 15 minutes
  RATE_LIMIT_MAX_REQUESTS: "1000"
