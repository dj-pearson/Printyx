apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: printyx

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - cronjob-backup.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: printyx-platform

images:
  - name: ghcr.io/dj-pearson/printyx
    newTag: latest
