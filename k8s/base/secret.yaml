apiVersion: v1
kind: Secret
metadata:
  name: printyx-secrets
  namespace: printyx
  labels:
    app.kubernetes.io/name: printyx
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database connection string
  # Replace with actual values or use sealed-secrets/external-secrets
  DATABASE_URL: 'postgresql://user:password@host:5432/database'
  # Session secret (generate with: openssl rand -base64 32)
  SESSION_SECRET: 'REPLACE_WITH_SECURE_SECRET'
  # Stripe API keys (if using Stripe)
  # STRIPE_SECRET_KEY: "sk_live_xxx"
  # STRIPE_WEBHOOK_SECRET: "whsec_xxx"
  # AI service keys (if using AI features)
  # ANTHROPIC_API_KEY: "sk-ant-xxx"
  # OPENAI_API_KEY: "sk-xxx"
  # Sentry DSN — routes backend errors/perf to the shared Printyx project.
  # A Sentry DSN is a public identifier (safe to store here / ship to clients).
  # Also baked into code as a production default (server/lib/apm.ts).
  SENTRY_DSN: 'https://dcc5602397f3cdc991f4c4aabed199b4@o4510398791352320.ingest.us.sentry.io/4511770291273728'
  VITE_SENTRY_DSN: 'https://dcc5602397f3cdc991f4c4aabed199b4@o4510398791352320.ingest.us.sentry.io/4511770291273728'
---
# Note: For production, consider using:
# - Sealed Secrets (https://sealed-secrets.netlify.app/)
# - External Secrets Operator (https://external-secrets.io/)
# - HashiCorp Vault
# - AWS Secrets Manager / GCP Secret Manager / Azure Key Vault
