# Supabase Edge Functions Configuration

project_id = "printyx"

[api]
enabled = true
port = 54321

[functions]
# Edge Functions configuration
enabled = true
verify_jwt = true

[functions.hello]
# Sample function configuration
verify_jwt = false  # Set to true if you want JWT verification

[functions.signup]
# Signup function - no JWT required (creates new users)
verify_jwt = false

[functions.me]
# Current user profile/role endpoint
verify_jwt = true

[functions.public-calculator]
# EDGE-005f: public marketing print-cost calculator (lead capture). No JWT —
# the page is anonymous. The Coolify server.ts dispatcher enforces auth
# per-handler (it ignores this file); this entry keeps the native Supabase
# runtime in sync. The handler itself performs no token verification.
verify_jwt = false

[functions.public-booking]
# CRMX-016: public Calendly-style meeting booking pages. Prospect-facing and
# anonymous — no JWT. Same rationale as public-calculator above: the handler
# performs no token check; the companion booking-pages fn (admin CRUD) is
# authenticated normally.
verify_jwt = false

