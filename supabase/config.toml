# Supabase Edge Functions Configuration

project_id = "printyx"

[api]
enabled = true
port = 54321

[functions]
# Edge Functions configuration
enabled = true
verify_jwt = true

[functions.hello]
# Sample function configuration
verify_jwt = false  # Set to true if you want JWT verification

[functions.signup]
# Signup function - no JWT required (creates new users)
verify_jwt = false

[functions.me]
# Current user profile/role endpoint
verify_jwt = true

[functions.print-cost-calculator]
# Public marketing print-cost calculator (anonymous lead capture) — no JWT.
verify_jwt = false

[functions.client-metrics]
# Agent-ingest path (EDGE-002j). Authenticates via a per-client API key passed
# as a Bearer token (NOT a Supabase JWT), so the native runtime must not
# JWT-verify before the handler hashes + looks it up against
# monitoring_clients.api_key.
verify_jwt = false

