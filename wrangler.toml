# Cloudflare Pages Configuration for Printyx
name = "printyx"
compatibility_date = "2025-12-08"

# Pages configuration
pages_build_output_dir = "dist/public"

# Observability settings
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

